name: Release VS Code extension
description: Build and publish the VS Code extension to Open VSX and VS Code Marketplace

inputs:
  azure-pat:
    description: Azure DevOps Personal Access Token for VS Code Marketplace
    required: true
  open-vsx-pat:
    description: Personal Access Token for Open VSX Registry
    required: true

runs:
  using: composite
  steps:
    - name: Validate publish tokens
      shell: bash
      run: |
        if [ -z "$AZURE_PAT" ]; then
          echo "Missing AZURE_VSCODE_PAT"
          exit 1
        fi
        if [ -z "$OPEN_VSX_PAT" ]; then
          echo "Missing OPEN_VSX_PAT"
          exit 1
        fi
      env:
        AZURE_PAT: ${{ inputs.azure-pat }}
        OPEN_VSX_PAT: ${{ inputs.open-vsx-pat }}

    - name: Build extension
      shell: bash
      run: pnpm --filter branch-context-vscode build
      env:
        CI: true

    - name: Get extension version
      id: version
      shell: bash
      run: |
        version="$(node -p "require('./apps/vscode-extension/package.json').version")"
        echo "current=$version" >> "$GITHUB_OUTPUT"

    - name: Publish to Open VSX
      id: publish_open_vsx
      uses: HaaLeo/publish-vscode-extension@v2
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        pat: ${{ inputs.open-vsx-pat }}
        packagePath: apps/vscode-extension
        dependencies: false
        skipDuplicate: true

    - name: Publish to VS Code Marketplace
      uses: HaaLeo/publish-vscode-extension@v2
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        pat: ${{ inputs.azure-pat }}
        registryUrl: https://marketplace.visualstudio.com
        extensionFile: ${{ steps.publish_open_vsx.outputs.vsixPath }}
        dependencies: false
        skipDuplicate: true

    - name: Create git tag
      shell: bash
      run: |
        tag="vscode-extension-v${{ steps.version.outputs.current }}"
        if git ls-remote --tags origin | grep -q "refs/tags/$tag$"; then
          exit 0
        fi
        git tag "$tag"
        git push origin "$tag"
