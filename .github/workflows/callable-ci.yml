name: Callable CI

on:
  workflow_call:
    inputs:
      run_lint:
        description: Run check
        type: boolean
        required: true
      run_build:
        description: Run typecheck and build
        type: boolean
        required: true
      run_test:
        description: Run tests
        type: boolean
        required: false
        default: false
    outputs:
      should_release:
        description: Whether any package version changed and should release
        value: ${{ jobs.check_version.outputs.should_release }}
      should_release_npm:
        description: Whether an NPM package version changed
        value: ${{ jobs.check_version.outputs.should_release_npm }}
      should_release_vscode:
        description: Whether the VS Code extension version changed and release tag is missing
        value: ${{ jobs.check_version.outputs.should_release_vscode }}

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      should_release_npm: ${{ steps.check.outputs.should_release_npm }}
      should_release_vscode: ${{ steps.check.outputs.should_release_vscode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup-and-install
        with:
          skip-install: 'true'

      - name: Check extension version
        id: check
        run: bash .github/scripts/check-version-bump.sh

  check:
    if: inputs.run_lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-and-install

      - name: Run check
        run: pnpm run check

      - name: Check generated docs
        run: pnpm run check:docs

      - name: Run knip
        run: pnpm run knip

  build:
    if: inputs.run_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-and-install

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run build
        run: pnpm run build
        env:
          CI: true

  test:
    if: inputs.run_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-and-install

      - name: Run tests
        run: pnpm run test
